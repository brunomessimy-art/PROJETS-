<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#33261c"><title>Mes Projets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;font-family:Segoe UI,Arial,sans-serif}.app{position:relative;width:100vw;height:100vh;background:url('accueil_reference.png') center/100% 100% no-repeat}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:2vw}.hot:focus-visible,.hot:hover{outline:3px solid rgba(255,255,255,.72);outline-offset:-3px;background:rgba(255,255,255,.035)}.h-stm{left:1.8%;top:23.2%;width:18.8%;height:49.8%}.h-terrain{left:21.7%;top:23.2%;width:18.4%;height:49.8%}.h-livre{left:41.2%;top:23.2%;width:18.4%;height:49.8%}.h-piano{left:60.7%;top:23.2%;width:18.3%;height:49.8%}.h-later{left:80.1%;top:23.2%;width:18.1%;height:49.8%}.h-actions{left:1.8%;top:76%;width:35.9%;height:21.1%}.h-deadlines{left:38.6%;top:76%;width:32.2%;height:21.1%}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,10,7,.72);backdrop-filter:blur(6px);padding:2vh 2vw}.modal.on{display:flex}.sheet{width:min(1050px,94vw);max-height:94vh;overflow:auto;color:#2e271f;background:linear-gradient(145deg,rgba(255,250,239,.98),rgba(233,217,190,.98));border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:20px 24px;box-shadow:0 20px 70px rgba(0,0,0,.48)}.head{display:flex;align-items:center;gap:12px}.ico{font-size:38px}.head h2{margin:0;font-size:27px}.head p{margin:2px 0 0;color:#786b5c}.close{margin-left:auto;border:0;background:#4b3a2b;color:white;border-radius:999px;width:44px;height:44px;font-size:22px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill,.datebox{background:#eee3d2;border:1px solid #d8c6ad;border-radius:13px;padding:8px 11px;font-weight:650}.datebox input{border:0;background:transparent;font:inherit;color:inherit}.progress{height:12px;background:#d6c8b4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#728c65;border-radius:99px}.steps{margin-top:12px}.step{display:grid;grid-template-columns:32px minmax(160px,1fr) 150px 44px 44px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #d9cbb8}.step input[type=checkbox]{width:24px;height:24px;accent-color:#728c65}.step input[type=text],.step input[type=date],.addrow input{width:100%;border:1px solid #c9b99f;border-radius:11px;padding:9px 10px;background:#fffaf1;font-size:15px}.iconbtn{height:40px;border:1px solid #c9b99f;border-radius:11px;background:#f5ead8;font-size:18px;cursor:pointer}.iconbtn.danger{background:#f1ddd7}.addrow{display:grid;grid-template-columns:1fr 170px 110px;gap:8px;margin-top:14px}.primary{border:0;border-radius:12px;padding:10px 14px;background:#536b4b;color:#fff;font-weight:700}.toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.dangerbtn{border:1px solid #b55b4c;border-radius:11px;padding:9px 12px;background:#9b4639;color:white;font-weight:700}.secondary{border:1px solid #bba98e;border-radius:11px;padding:9px 12px;background:#f6ecdc;color:#44372c;font-weight:650}.dangerText{color:#9b4639}.hint{color:#776a5c;font-size:13px;margin-top:10px}.overdue{background:rgba(180,65,48,.09)}.soon{background:rgba(196,138,41,.10)}.done .stepname{text-decoration:line-through;opacity:.55}.summaryrow{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #d9cbb8}.summaryrow b{min-width:120px}.empty{padding:22px;text-align:center;color:#7c6e5e}
@media(max-width:760px) and (orientation:landscape){.sheet{width:96vw;max-height:92vh;padding:13px 16px;border-radius:18px}.head h2{font-size:21px}.ico{font-size:30px}.meta{margin:8px 0}.step{grid-template-columns:28px minmax(140px,1fr) 125px 38px 38px 38px;gap:5px;padding:5px 0}.step input[type=text],.step input[type=date],.addrow input{padding:7px;font-size:14px}.iconbtn{height:36px}.addrow{grid-template-columns:1fr 145px 90px;margin-top:9px}.toolbar{margin-top:9px}.hint{display:none}}
@media(orientation:portrait) and (max-width:760px){body:before{content:'↔ Tourne le téléphone en paysage';position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#2e251d;color:#fff4e5;font-size:24px;font-weight:700}}
</style></head><body><div class="app"><button class="hot h-stm" data-id="stm" aria-label="Charli STM"></button><button class="hot h-terrain" data-id="terrain" aria-label="Charli Terrain"></button><button class="hot h-livre" data-id="livre" aria-label="Livre"></button><button class="hot h-piano" data-id="piano" aria-label="Piano"></button><button class="hot h-later" data-id="later" aria-label="Plus tard"></button><button class="hot h-actions" data-id="actions" aria-label="Prochaines actions"></button><button class="hot h-deadlines" data-id="deadlines" aria-label="Échéances"></button></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const defaults={stm:{name:'Charli STM',icon:'🛠️',sub:'Finalisation et stabilité',date:'2026-10-31',steps:[{t:'Finaliser la sauvegarde automatique',d:'2026-10-10',ok:false},{t:'Stabiliser STM Bureau',d:'2026-10-20',ok:false},{t:'Tester l’installation sur un second poste',d:'2026-10-28',ok:false}]},terrain:{name:'Charli Terrain',icon:'📱',sub:'Version équipe et terrain',date:'2026-11-15',steps:[{t:'Permettre aux chefs de choisir les agents',d:'2026-10-15',ok:false},{t:'Tester la synchronisation',d:'2026-10-30',ok:false},{t:'Valider la version terrain',d:'2026-11-10',ok:false}]},livre:{name:'Livre',icon:'📖',sub:'Édition familiale pour Noël',date:'2026-12-15',steps:[{t:'Finaliser les chapitres',d:'2026-10-31',ok:false},{t:'Faire la relecture complète',d:'2026-11-15',ok:false},{t:'Mise en page 11 × 17',d:'2026-11-25',ok:false},{t:'Commander un exemplaire test',d:'2026-12-01',ok:false},{t:'Lancer l’impression familiale',d:'2026-12-08',ok:false}]},piano:{name:'Piano',icon:'🎵',sub:'Plaisir et progression',date:'',steps:[{t:'Continuer la méthode Piano-Voix',d:'',ok:false},{t:'Travailler l’accompagnement d’une chanson',d:'',ok:false}]},later:{name:'Plus tard',icon:'💡',sub:'Idées et projets en attente',date:'',steps:[{t:'Application cétogène',d:'',ok:false}]}};
const key='mes-projets-v2';let raw=JSON.parse(localStorage.getItem(key)||'null');let data=raw||structuredClone(defaults); // migrate V1
for(const p of Object.values(data)){p.steps=(p.steps||[]).map(s=>Array.isArray(s)?{t:s[0],ok:!!s[1],d:''}:{t:s.t||'',ok:!!s.ok,d:s.d||''})}
const save=()=>localStorage.setItem(key,JSON.stringify(data));const pct=p=>p.steps.length?Math.round(p.steps.filter(s=>s.ok).length/p.steps.length*100):0;const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'En continu';const today=()=>new Date().toISOString().slice(0,10);function state(s){if(s.ok||!s.d)return'';let delta=(new Date(s.d+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5;return delta<0?'overdue':delta<=7?'soon':''}
function open(){modal.classList.add('on')}function close(){modal.classList.remove('on')}
function project(id){const p=data[id];if(!p){alert('Ce projet a été supprimé.');return}sheet.innerHTML=`<div class="head"><div class="ico">${p.icon}</div><div><h2>${p.name}</h2><p>${p.sub}</p></div><button class="close">×</button></div><div class="meta"><label class="datebox">📅 Date butoir <input id="deadline" type="date" value="${p.date||''}"></label><span class="pill">${pct(p)} % terminé</span></div><div class="progress"><i style="width:${pct(p)}%"></i></div><div class="steps">${p.steps.map((s,i)=>`<div class="step ${state(s)} ${s.ok?'done':''}"><input type="checkbox" data-ok="${i}" ${s.ok?'checked':''}><input class="stepname" type="text" data-text="${i}" value="${esc(s.t)}" aria-label="Nom de l’étape"><input type="date" data-date="${i}" value="${s.d||''}" aria-label="Date intermédiaire"><button class="iconbtn" data-up="${i}" title="Monter">↑</button><button class="iconbtn" data-down="${i}" title="Descendre">↓</button><button class="iconbtn danger" data-del="${i}" title="Supprimer">🗑</button></div>`).join('')}</div><div class="addrow"><input id="newText" placeholder="Nouvelle étape…"><input id="newDate" type="date"><button class="primary" id="add">Ajouter</button></div><div class="toolbar"><button class="dangerbtn" id="deleteProject">🗑️ Supprimer ce projet</button><button class="secondary" id="backup">💾 Sauvegarder</button><label class="secondary" style="cursor:pointer">↩ Restaurer<input id="restore" type="file" accept="application/json" hidden></label></div><div class="hint">Les modifications sont enregistrées automatiquement sur ce téléphone.</div>`;open();sheet.querySelector('.close').onclick=close;sheet.querySelector('#deadline').onchange=e=>{p.date=e.target.value;save()};sheet.querySelectorAll('[data-ok]').forEach(x=>x.onchange=()=>{p.steps[+x.dataset.ok].ok=x.checked;save();project(id)});sheet.querySelectorAll('[data-text]').forEach(x=>x.onchange=()=>{p.steps[+x.dataset.text].t=x.value.trim()||'Étape';save()});sheet.querySelectorAll('[data-date]').forEach(x=>x.onchange=()=>{p.steps[+x.dataset.date].d=x.value;save();project(id)});sheet.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(id,+x.dataset.up,-1));sheet.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(id,+x.dataset.down,1));sheet.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('Supprimer cette étape ?')){p.steps.splice(+x.dataset.del,1);save();project(id)}});sheet.querySelector('#add').onclick=()=>{let t=sheet.querySelector('#newText').value.trim();if(!t)return;p.steps.push({t,d:sheet.querySelector('#newDate').value,ok:false});save();project(id)};sheet.querySelector('#deleteProject').onclick=()=>deleteProject(id);sheet.querySelector('#backup').onclick=backup;sheet.querySelector('#restore').onchange=restore}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function move(id,i,dir){const a=data[id].steps,j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();project(id)}
function deleteProject(id){if(id==='later'){alert('Le dossier « Plus tard » est conservé car il sert à ranger les projets futurs. Tu peux supprimer toutes ses étapes si tu veux le vider.');return}const p=data[id];if(!p)return;if(confirm('Supprimer définitivement le projet « '+p.name+' » et toutes ses étapes ?')){delete data[id];save();close();alert('Projet supprimé.')}}
function summary(kind){let rows=[];Object.values(data).forEach(p=>{if(kind==='actions'){let s=p.steps.find(x=>!x.ok);if(s)rows.push(`<div class="summaryrow"><span>${p.icon}</span><b>${p.name}</b><span>${esc(s.t)}${s.d?' · '+fmt(s.d):''}</span></div>`)}else{if(p.date)rows.push(`<div class="summaryrow"><span>${p.icon}</span><b>${p.name}</b><span>${fmt(p.date)}</span></div>`);p.steps.filter(s=>s.d&&!s.ok).forEach(s=>rows.push(`<div class="summaryrow"><span>↳</span><b>${p.name}</b><span>${esc(s.t)} · ${fmt(s.d)}</span></div>`))}});sheet.innerHTML=`<div class="head"><div class="ico">${kind==='actions'?'🎯':'📅'}</div><div><h2>${kind==='actions'?'Mes prochaines actions':'Échéances'}</h2><p>${kind==='actions'?'Première étape non terminée de chaque projet':'Dates butoirs et intermédiaires'}</p></div><button class="close">×</button></div><div class="steps">${rows.join('')||'<div class="empty">Rien à afficher.</div>'}</div>`;open();sheet.querySelector('.close').onclick=close}
function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mes-projets-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;data=x;save();alert('Sauvegarde restaurée.');close()}catch{alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{let id=b.dataset.id;(id==='actions'||id==='deadlines')?summary(id):project(id)});modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};save();
</script></body></html>
